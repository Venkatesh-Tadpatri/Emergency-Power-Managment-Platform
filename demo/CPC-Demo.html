<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPC — Critical Power Command (Demo)</title>
<style>
  :root{
    --bg:#eef3fa; --card:#ffffff; --card-2:#f6f9fd; --border:#dbe6f4; --text:#16273e; --text-dim:#5e7796;
    --sidebar-1:#0a1a30; --sidebar-2:#0e2748; --sidebar-text:#c6d7ee; --sidebar-dim:#7d93b3;
    --accent:#2563eb; --accent-dim:#e7f0ff; --accent-2:#1d4fd8;
    --green:#16a34a; --green-bg:#e7f8ee; --red:#dc2626; --red-bg:#fdecec; --amber:#d97706; --amber-bg:#fdf2e0; --purple:#7c3aed; --purple-bg:#f1eafe;
    --radius:12px; --shadow:0 6px 18px rgba(20,45,90,.08);
  }
  body.dark{
    --bg:#0a1728; --card:#0f2038; --card-2:#0b1a30; --border:#1e3557; --text:#dfeaf9; --text-dim:#8fa5c4;
    --sidebar-1:#050e1c; --sidebar-2:#081426; --accent-dim:#122a4d;
    --green-bg:#0d2a1c; --red-bg:#301418; --amber-bg:#2c2009; --purple-bg:#221a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s ease,color .2s ease;}
  button,input{font:inherit;color:inherit;}
  a{color:inherit;}
  #root{min-height:100vh;}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#123 0%,#050b16 60%);padding:20px;}
  .login-card{width:100%;max-width:380px;background:#0f1d33;border:1px solid #24406a;border-radius:16px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .login-logo i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;font-style:normal;}
  .login-logo b{color:#fff;font-size:16px;}
  .login-logo span{display:block;color:#8fa5c4;font-size:10px;letter-spacing:.06em;text-transform:uppercase;}
  .login-card h1{color:#fff;font-size:19px;margin:18px 0 4px;}
  .login-card p{color:#93a8c6;font-size:12.5px;margin:0 0 22px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;color:#9db2cf;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .login-field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a4a76;background:#0b1930;color:#e7eefb;}
  .login-btn{width:100%;padding:11px;margin-top:8px;border:0;border-radius:8px;background:linear-gradient(135deg,#2563eb,#1d4fd8);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}
  .login-btn:hover{filter:brightness(1.08);}
  .login-note{margin-top:16px;padding:10px 12px;border-radius:8px;background:#132846;border:1px solid #1f3d66;color:#9db8dc;font-size:11px;}
  .login-badge{display:inline-block;margin-top:16px;color:#5f7ba3;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;}
  .login-role-group{display:flex;gap:8px;margin:2px 0 18px;}
  .login-role-pill{flex:1;padding:10px 8px;border-radius:10px;border:1px solid #2a4a76;background:#0b1930;color:#9db2cf;cursor:pointer;text-align:center;}
  .login-role-pill b{display:block;font-size:11.5px;color:#e7eefb;margin-bottom:2px;}
  .login-role-pill span{display:block;font-size:8.5px;color:#7d93b3;line-height:1.3;}
  .login-role-pill.sel{border-color:#2563eb;background:linear-gradient(135deg,rgba(37,99,235,.3),rgba(124,58,237,.22));}
  .login-role-pill.sel b{color:#fff;}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--sidebar-1),var(--sidebar-2));color:var(--sidebar-text);display:flex;flex-direction:column;}
  .sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-header i{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-style:normal;font-size:14px;flex:0 0 auto;}
  .sidebar-brand b{display:block;color:#fff;font-size:13px;letter-spacing:.03em;}
  .sidebar-brand span{display:block;color:var(--sidebar-dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;}
  .sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px 16px;}
  .scope-header{padding:8px 8px 10px;cursor:pointer;color:#9db3d4;font-size:11px;font-weight:700;}
  .scope-header:hover{color:#fff;}
  .scope-title{padding:0 8px;color:#fff;font-size:14px;font-weight:800;line-height:1.25;}
  .scope-sub{padding:2px 8px 12px;color:var(--sidebar-dim);font-size:10.5px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .nav-section{margin-bottom:14px;}
  .nav-label{padding:0 8px 6px;color:#5f7ba3;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sidebar-text);}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(37,99,235,.22);color:#fff;}
  .nav-item .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex:0 0 auto;background:rgba(255,255,255,.08);}
  .nav-item.sub{padding-left:10px;}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .dot.g{background:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.25);}
  .dot.r{background:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.25);}
  .dot.n{background:#94a3b8;box-shadow:0 0 0 2px rgba(148,163,184,.25);}
  .nav-badge{margin-left:auto;background:#dc2626;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;}
  .sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#54719c;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--border);}
  .breadcrumb{color:var(--text-dim);font-size:11px;margin-bottom:3px;}
  .breadcrumb span.link{cursor:pointer;color:var(--accent);font-weight:600;}
  .breadcrumb span.sep{margin:0 5px;opacity:.6;}
  .page-title{font-size:18px;font-weight:800;}
  .page-sub{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .demo-pill{display:flex;align-items:center;gap:5px;background:var(--amber-bg);color:var(--amber);font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card-2);display:grid;place-items:center;cursor:pointer;font-size:14px;}
  .icon-btn:hover{background:var(--accent-dim);}
  .user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--border);background:var(--card-2);cursor:pointer;}
  .user-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;}
  .user-chip b{display:block;font-size:11.5px;}
  .user-chip small{display:block;color:var(--text-dim);font-size:9.5px;}
  .user-menu-wrap{position:relative;}
  .user-menu{position:absolute;top:calc(100% + 8px);right:0;width:200px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:10px;z-index:50;}
  .user-menu-role{padding:4px 6px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;font-size:10px;color:var(--text-dim);}
  .user-menu-role b{display:block;color:var(--text);font-size:12.5px;margin-top:2px;}
  .user-menu-item{width:100%;text-align:left;padding:8px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:12px;color:var(--text);}
  .user-menu-item:hover{background:var(--accent-dim);color:var(--accent);}
  .content{padding:22px 26px 60px;}

  /* ---------- generic ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .section-head h2{margin:0;font-size:15px;}
  .section-head span{display:block;color:var(--accent);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);cursor:pointer;font-weight:700;font-size:12px;}
  .btn:hover{background:var(--accent-dim);}
  .btn.primary{background:var(--accent);border-color:var(--accent-2);color:#fff;}
  .btn.primary:hover{background:var(--accent-2);}
  .btn.small{padding:5px 9px;font-size:11px;border-radius:6px;}
  .btn.danger{background:var(--red-bg);border-color:#f3b9b9;color:var(--red);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{padding:16px;}
  .kpi span{display:block;color:var(--text-dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .kpi b{font-size:24px;}
  .kpi small{display:block;margin-top:4px;color:var(--text-dim);font-size:11px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .obj-card{padding:16px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;}
  .obj-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,45,90,.14);}
  .obj-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .obj-card-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:15px;}
  .obj-card h3{margin:0 0 2px;font-size:13.5px;}
  .obj-card p{margin:0;color:var(--text-dim);font-size:11px;}
  .obj-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;}
  .obj-stat{text-align:center;padding:6px 2px;border-radius:7px;background:var(--card-2);}
  .obj-stat b{display:block;font-size:14px;}
  .obj-stat span{display:block;font-size:8.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;}
  .pill.g{background:var(--green-bg);color:var(--green);}
  .pill.r{background:var(--red-bg);color:var(--red);}
  .pill.a{background:var(--amber-bg);color:var(--amber);}
  .pill.n{background:var(--card-2);color:var(--text-dim);}
  .pill-lg{padding:6px 14px;font-size:12px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;gap:7px;}
  .pill-lg.n{background:var(--card-2);color:var(--text-dim);}
  .pill-lg.blink,.pill.blink{animation:emergency-blink 1s steps(2,end) infinite;}

  /* ---------- site system card ---------- */
  .site-system-card{padding:16px;border-left:4px solid var(--green);}
  .site-system-card.status-emergency{border-left-color:var(--red);}
  .site-system-card.status-offline{border-left-color:var(--text-dim);opacity:.92;}
  .site-system-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
  .site-system-card-head h3{margin:0;font-size:13.5px;}
  .site-system-card-sub{color:var(--text-dim);font-size:11px;margin-bottom:12px;}
  .site-system-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .site-system-stat{padding:8px 4px;border-radius:8px;background:var(--card-2);text-align:center;}
  .site-system-stat span{display:block;font-size:8.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .site-system-stat b{display:block;font-size:11.5px;}
  .stat-good{color:var(--green);}
  .stat-bad{color:var(--red);}
  .site-system-card-actions{display:flex;gap:8px;}
  .site-system-card-actions button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);cursor:pointer;font-weight:700;font-size:11px;color:var(--text);}
  .site-system-card-actions button:hover{background:var(--accent-dim);border-color:var(--accent-2);}
  .site-systems-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

  table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
  table.tbl th{text-align:left;color:var(--text-dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--card-2);white-space:nowrap;}
  table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.tbl tbody tr:hover{background:var(--card-2);}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  .state-ok{color:var(--green);font-weight:800;}
  .state-bad{color:var(--red);font-weight:800;}

  .placeholder{padding:60px 20px;text-align:center;color:var(--text-dim);}
  .placeholder i{display:block;font-size:34px;margin-bottom:14px;}
  .placeholder h3{color:var(--text);margin:0 0 6px;}

  /* ---------- system detail ---------- */
  .hero{display:flex;gap:18px;padding:20px;margin-bottom:18px;}
  .hero-left{flex:1;}
  .hero-kicker{display:block;color:var(--accent);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .hero h1{margin:0 0 4px;font-size:20px;}
  .hero p{margin:0 0 12px;color:var(--text-dim);font-size:12px;}
  .tabs{display:flex;gap:6px;margin-top:14px;}
  .tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);cursor:pointer;font-weight:700;font-size:12px;}
  .tab.active{background:var(--accent);border-color:var(--accent-2);color:#fff;}
  .events-panel{width:280px;flex:0 0 280px;}
  .events-panel .eh{font-weight:800;font-size:11.5px;padding:10px 12px;border-bottom:1px solid var(--border);}
  .events-panel ul{list-style:none;margin:0;padding:6px;}
  .events-panel li{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;font-size:11px;}
  .events-panel li time{color:var(--text-dim);font-size:9.5px;flex:0 0 auto;}
  .ev-critical{background:var(--red-bg);}
  .ev-warning{background:var(--amber-bg);}
  .ev-resolved{color:var(--text-dim);}

  .op-section{margin-bottom:20px;}
  .op-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .op-head span{display:block;color:var(--accent);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;}
  .op-head h3{margin:2px 0 0;font-size:14px;}

  /* ---------- one-line diagram (production SLD, ported) ---------- */
  .system-sld{margin:0;overflow:hidden;border:1px solid #cddff1;border-radius:10px;background:linear-gradient(145deg,#fbfdff,#eef6ff);box-shadow:0 5px 14px rgba(30,64,112,.07);}
  .system-sld-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:1px solid #d8e6f3;background:rgba(255,255,255,.7);}
  .system-sld-header span{display:block;margin-bottom:2px;color:#3076ca;font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;}
  .system-sld-header h3{margin:0;color:#183150;font-size:13px;}
  .system-sld-legend{display:flex;align-items:center;gap:6px;color:#637c99;font-size:9px;font-weight:600;}
  .system-sld-legend i{width:8px;height:8px;margin-left:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px #dcfce7;display:inline-block;}
  .system-sld-legend i.emergency{background:#ef4444;box-shadow:0 0 0 3px #fee2e2;}
  .system-sld-canvas{min-width:700px;overflow-x:auto;padding:12px 18px 14px;background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);background-size:20px 20px;}
  .system-sld-canvas-inner{width:100%;}
  .sld-sources{display:flex;align-items:flex-start;justify-content:space-between;height:172px;overflow:hidden;}
  .sld-source{position:relative;display:flex;align-items:center;gap:8px;}
  .sld-source>i{display:grid;place-items:center;width:30px;height:30px;color:#15803d;font-style:normal;font-size:16px;}
  .sld-source b,.sld-source small{display:block;}
  .sld-source b{color:#1d4f38;font-size:10px;letter-spacing:.06em;}
  .sld-source small{margin-top:2px;color:#6b8b7b;font-size:8px;}
  .sld-utility-column{display:flex;flex-direction:column;align-items:flex-start;}
  .sld-gear-connector{display:block;width:2px;height:18px;margin:0 0 0 14px;background:#22c55e;}
  .sld-gear-connector.tail{height:80px;}
  .sld-generators .sld-generator-column:first-child .sld-gear-connector.tail{height:110px;}
  .sld-gear-connector.lead{height:60px;}
  .sld-gear-connector.emergency-source{background:#ef4444;}
  .sld-gear-icon{display:grid;place-items:center;width:30px;height:30px;flex:0 0 auto;overflow:visible;}
  .sld-symbol{color:#22c55e;flex:0 0 auto;}
  .sld-breaker-symbol.emergency{color:#ef4444;}
  .sld-breaker-tag{align-self:flex-start;margin:0;padding:0;border:0;background:transparent;color:#166534;font:800 8px 'Courier New',monospace;text-transform:uppercase;white-space:nowrap;}
  .sld-breaker-tag.emergency-source{color:#b91c1c;}
  .sld-generators{position:relative;display:flex;flex-wrap:nowrap;align-items:flex-start;gap:40px;margin-right:8px;}
  .sld-generator-column{display:flex;flex-direction:column;align-items:center;width:46px;min-width:46px;}
  .sld-generator-column .sld-gear-connector{margin:0 auto;}
  .sld-generator{position:relative;display:grid;justify-items:center;width:46px;min-width:46px;text-align:center;padding:0;border:0;background:transparent;cursor:pointer;font:inherit;}
  .sld-generator i{position:relative;z-index:2;display:grid;place-items:center;width:29px;height:29px;border:2px solid #111827;border-radius:50%;color:#fff;background:#22c55e;font:800 16px Inter,sans-serif;font-style:normal;}
  .sld-generator.emergency-source i{background:#ef4444;animation:emergency-blink 1s steps(2,end) infinite;}
  .sld-generator span{order:-1;display:block;margin-bottom:2px;overflow:hidden;max-width:56px;color:#1d4f38;font-size:8px;font-weight:800;line-height:8px;text-align:center;text-overflow:ellipsis;white-space:nowrap;}
  .sld-generator small{order:-1;display:block;margin-bottom:2px;color:#4b7360;font-size:7px;line-height:7px;text-align:center;white-space:nowrap;}
  .sld-generator.emergency-source small{color:#c92a2a;}
  .sld-generator:focus-visible,.sld-switch:focus-visible{outline:3px solid #2563eb;outline-offset:3px;}
  .sld-breaker-with-tag{position:relative;display:inline-flex;align-items:center;}
  .sld-breaker-with-tag .sld-breaker-tag{position:absolute;left:100%;top:50%;margin-left:5px;transform:translateY(-50%);white-space:nowrap;}
  .sld-buses{position:relative;display:grid;grid-template-rows:16px 16px;margin:0 30px 0 15px;}
  .sld-bus{position:relative;border-top:2px solid #22c55e;}
  .sld-bus span{position:absolute;right:0;top:-12px;padding:1px 5px;border-radius:5px;color:#15803d;background:#ecf5f0;font-size:7px;font-weight:800;text-transform:uppercase;}
  .sld-bus.normal span{top:-13px;right:auto;left:0;}
  .sld-bus.emergency{border-color:#ef4444;}
  .sld-bus.emergency::before{content:"";position:absolute;top:-19px;right:0;height:17px;border-left:2px solid #ef4444;}
  .sld-bus.emergency span{top:3px;color:#c92a2a;background:#fff1f2;}
  .sld-ats-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(100px,1fr);gap:10px;margin-top:2px;}
  .sld-ats{position:relative;display:grid;justify-items:center;padding-top:13px;text-align:center;}

/* ---------------------------- helpers ---------------------------- */
function byId(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
function companiesOfReseller(rid){ return DB.companies.filter(function(c){return c.resellerId===rid;}); }
function sitesOfCompany(cid){ return DB.sites.filter(function(s){return s.companyId===cid;}); }
function systemsOfSite(sid){ return DB.systems.filter(function(s){return s.siteId===sid;}); }
function systemsOfCompany(cid){ var siteIds=sitesOfCompany(cid).map(function(s){return s.id;}); return DB.systems.filter(function(s){return siteIds.indexOf(s.siteId)>-1;}); }
function systemsOfReseller(rid){ var cids=companiesOfReseller(rid).map(function(c){return c.id;}); var out=[]; cids.forEach(function(cid){ out=out.concat(systemsOfCompany(cid)); }); return out; }
function siteOf(system){ return byId(DB.sites, system.siteId); }
function companyOf(system){ return byId(DB.companies, siteOf(system).companyId); }
function resellerOf(company){ return company.resellerId ? byId(DB.resellers, company.resellerId) : null; }
function alarmsFor(systemIds){ return DB.alarms.filter(function(a){ return systemIds.indexOf(a.systemId)>-1; }); }
function fmtHMS(sec){ if(sec===null||sec===undefined) return '—'; var m=Math.floor(sec/60), s=sec%60; return m+'m '+s+'s'; }
function pad2(n){ n=Math.floor(n); return (n<10?'0':'')+n; }

/* ---------------------------- navigation ---------------------------- */
function goDashboard(){ state.page='dashboard'; state.scope=null; closeModal(true); render(); }
function goResellers(){ state.page='resellers'; state.scope=null; closeModal(true); render(); }
function goCompaniesAll(){ state.page='companies-all'; state.scope=null; closeModal(true); render(); }
function goReseller(id){ state.page='reseller'; state.scope={level:'reseller', resellerId:id}; closeModal(true); render(); }
function goCompany(id){
  var company = byId(DB.companies, id);
  state.page='company';
  state.scope={level:'company', resellerId:company.resellerId, companyId:id, siteId:null};
  closeModal(true); render();
}
function goSite(id){
  if(state.role==='operator' && scopedSystemsOfSite(id).length===0) id='S1';
  var site = byId(DB.sites, id);
  state.page='site';
  state.scope={level:'company', resellerId: byId(DB.companies, site.companyId).resellerId, companyId: site.companyId, siteId:id};
  closeModal(true); render();
}
function openSystem(id){
  if(!isSystemVisible(id)) id=OPERATOR_SYSTEM_ID;
  var system = byId(DB.systems, id);
  var site = siteOf(system), company = companyOf(system);
  state.page='system'; state.systemId=id; state.systemTab='details';
  state.scope={level:'company', resellerId: company.resellerId, companyId: company.id, siteId: site.id};
  closeModal(true); render();
}

/* Operator persona is scoped to a single system for this demo, matching the
   real app's "assigned systems" access model (see PlatformUsers scope picker). */
var OPERATOR_SYSTEM_ID = 'SYS1';
function isSystemVisible(sysId){ return state.role!=='operator' || sysId===OPERATOR_SYSTEM_ID; }
function scopedSystemsOfCompany(companyId){ return systemsOfCompany(companyId).filter(function(sy){return isSystemVisible(sy.id);}); }
function scopedSystemsOfSite(siteId){ return systemsOfSite(siteId).filter(function(sy){return isSystemVisible(sy.id);}); }
function scopedSitesOfCompany(companyId){
  var sites=sitesOfCompany(companyId);
  if(state.role!=='operator') return sites;
  return sites.filter(function(s){ return scopedSystemsOfSite(s.id).length>0; });
}
function canLeaveScope(){ return state.role==='superadmin'; }

/* ---------------------------- test wizard ---------------------------- */
function openTestWizard(systemId, type, id){
  var sys = byId(DB.systems, systemId);
  state.wizard = {
    systemId: systemId,
    step:'setup',
    testType: type==='ats' ? 'load' : 'no-load',
    duration:35, startDelay:2, blockSize:2, blockDelay:10,
    atsIds: type==='ats' ? [id] : sys.ats.map(function(a){return a.id;}),
    genIds: type==='generator' ? [id] : sys.generators.map(function(g){return g.id;}),
    initiatingAtsId: type==='ats' ? id : (sys.ats[0] ? sys.ats[0].id : ''),
    elapsed:0
  };
  state.modal={kind:'test'};
  render();
}
function wizardSetType(t){ state.wizard.testType=t; render(); }
function wizardSetNum(field, val){ state.wizard[field]=Math.max(field==='startDelay'||field==='blockDelay'?0:1, Number(val)||0); render(); }
function wizardToggleAts(id){
  var w=state.wizard; var i=w.atsIds.indexOf(id);
  if(i>-1) w.atsIds.splice(i,1); else w.atsIds.push(id);
  if(w.initiatingAtsId===id && i>-1) w.initiatingAtsId='';
  render();
}
function wizardToggleGen(id){
  var w=state.wizard; var i=w.genIds.indexOf(id);
  if(i>-1) w.genIds.splice(i,1); else w.genIds.push(id);
  render();
}
function wizardSelectAllAts(){ state.wizard.atsIds = byId(DB.systems, state.wizard.systemId).ats.map(function(a){return a.id;}); render(); }
function wizardClearAts(){ state.wizard.atsIds=[]; state.wizard.initiatingAtsId=''; render(); }
function wizardSelectAllGen(){ state.wizard.genIds = byId(DB.systems, state.wizard.systemId).generators.map(function(g){return g.id;}); render(); }
function wizardClearGen(){ state.wizard.genIds=[]; render(); }
function wizardSetInitiating(id){ state.wizard.initiatingAtsId=id; render(); }
function wizardGoStep(step){ state.wizard.step=step; render(); }

}

    '<div class="login-logo"><i>CPC</i><div><b>Critical Power Command</b><span>Solution 61</span></div></div>' +

function sidebarNav(){
  var scope=state.scope;

    var activeSiteId=scope.siteId;
    var systems= activeSiteId ? scopedSystemsOfSite(activeSiteId) : [];
    var active=alarmsFor(scopedSystemsOfCompany(company.id).map(function(s){return s.id;})).filter(function(a){return a.status==='active';});
    var html='';
    if(canLeaveScope()){
      html+='<div class="scope-header" onclick="'+(reseller?"goReseller('"+reseller.id+"')":"goDashboard()")+'">&larr; '+(reseller?reseller.name:'Dashboard')+'</div>';
    }
    html+='<div class="scope-title">'+company.name+'</div><div class="scope-sub">'+company.address+'</div>';
    html+='<div class="nav-section"><div class="nav-label">Overview</div>';
    html+=navItem('&#128202;','Dashboard', state.page==='company', "goCompany('"+company.id+"')");
    html+=navItem('&#128506;','Map View', state.page==='map', "goMapView()");
    html+='</div>';
    html+='<div class="nav-section"><div class="nav-label">'+(activeSiteId?'Systems':'Sites')+'</div>';
    if(activeSiteId){
      systems.forEach(function(sy){
        var syStatus=systemStats(sy).effectiveStatus;
        html+='<div class="nav-item sub'+(state.systemId===sy.id?' active':'')+'" onclick="openSystem(\''+sy.id+'\')"><span class="dot '+(syStatus==='normal'?'g':syStatus==='offline'?'n':'r')+'"></span>'+sy.name+'</div>';

    } else {

      });
    }
    html+='</div>';
    html+='<div class="nav-section"><div class="nav-label">Monitoring</div>';
    html+=navItem('&#128276;','Alarms', state.page==='alarms', "goAlarms()", active.length||null);
    html+=navItem('&#128222;','On-Call', state.page==='oncall', "goOnCall()");
    html+=navItem('&#128200;','Analytics', state.page==='analytics', "goAnalytics()");
    html+='</div>';

  }

    var r=byId(DB.resellers, scope.resellerId);

    var html2='';

    html2+='<div class="scope-title">'+r.name+'</div><div class="scope-sub">Reseller Context</div>';
    html2+='<div class="nav-section"><div class="nav-label">Overview</div>';
    html2+=navItem('&#128202;','Dashboard', state.page==='reseller', "goReseller('"+r.id+"')");
    html2+=navItem('&#128506;','Map View', state.page==='map', "goMapView()");
    html2+='</div>';
    html2+='<div class="nav-section"><div class="nav-label">Portfolio</div>';
    html2+=navItem('&#127970;','Customers', state.page==='reseller', "goReseller('"+r.id+"')");
    html2+=navItem('&#128101;','Users', state.page==='users', "goUsers()");
    html2+='</div>';
    html2+='<div class="nav-section"><div class="nav-label">Monitoring</div>';
    html2+=navItem('&#128276;','Alarms', state.page==='alarms', "goAlarms()", alarmsR.length||null);
    html2+='</div>';
    return html2;
  }
  var html3='';
  html3+='<div class="nav-section"><div class="nav-label">Overview</div>';
  html3+=navItem('&#128202;','Dashboard', state.page==='dashboard', "goDashboard()");
  html3+=navItem('&#128506;','Map View', state.page==='map', "goMapView()");
  html3+='</div>';
  html3+='<div class="nav-section"><div class="nav-label">Hierarchy</div>';
  html3+=navItem('&#129513;','Resellers', state.page==='resellers', "goResellers()");
  html3+=navItem('&#127970;','Customers', state.page==='companies-all', "goCompaniesAll()");
  html3+='</div>';
  var allActive = DB.alarms.filter(function(a){return a.status==='active';});

  html3+=navItem('&#128276;','All Alarms', state.page==='alarms', "goAlarms()", allActive.length||null);

function scopeCrumbItems(){
  var items=[]; var scope=state.scope;
  if(scope && scope.level==='company'){
    var c=byId(DB.companies, scope.companyId); var res=resellerOf(c);
    if(res && canLeaveScope()) items.push({label:res.name, fn:"goReseller('"+res.id+"')"});
    items.push({label:c.name, fn:"goCompany('"+c.id+"')"});
  } else if(scope && scope.level==='reseller'){
    var r=byId(DB.resellers, scope.resellerId);
    items.push({label:r.name, fn:"goReseller('"+r.id+"')"});
  }
  return items;
}

function crumb(items){
  var html='<div class="breadcrumb">';
  items.forEach(function(it,i){
    html+='<span class="link" onclick="'+it.fn+'">'+it.label+'</span><span class="sep">&rsaquo;</span>';
  });
  html+='</div>';
  return html;
}

function topbar(){
  var title='Dashboard', sub='Welcome back — here is your fleet at a glance.', bc='';
  if(state.page==='resellers'){ title='Resellers'; sub='View and manage reseller partners across your organization.'; }
  else if(state.page==='companies-all'){ title='Customers'; sub='View and manage all customers across your organization.'; }
  else if(state.page==='reseller'){
    var r=byId(DB.resellers, state.scope.resellerId);
    title=r.name; sub='Reseller performance overview.';
    bc=crumb([{label:'All Resellers', fn:'goResellers()'}]);
  }
  else if(state.page==='company'){
    var c=byId(DB.companies, state.scope.companyId); var res=resellerOf(c);
    title=c.name; sub='Customer sites and system status.';
    var items=[]; if(res && canLeaveScope()) items.push({label:res.name, fn:"goReseller('"+res.id+"')"});
    bc=crumb(items);
  }
  else if(state.page==='site'){
    var site=byId(DB.sites, state.scope.siteId); var comp=byId(DB.companies, site.companyId); var res2=resellerOf(comp);
    title=site.name; sub='Emergency power systems installed at this site.';
    var items2=[]; if(res2 && canLeaveScope()) items2.push({label:res2.name, fn:"goReseller('"+res2.id+"')"});
    items2.push({label:comp.name, fn:"goCompany('"+comp.id+"')"});
    bc=crumb(items2);
  }
  else if(state.page==='system'){
    var sys=byId(DB.systems, state.systemId); var st=siteOf(sys); var co=companyOf(sys); var res3=resellerOf(co);
    title=sys.name; sub='Utility, generator and transfer-switch status.';
    var items3=[]; if(res3 && canLeaveScope()) items3.push({label:res3.name, fn:"goReseller('"+res3.id+"')"});
    items3.push({label:co.name, fn:"goCompany('"+co.id+"')"});
    items3.push({label:st.name, fn:"goSite('"+st.id+"')"});
    bc=crumb(items3);
  }
  else if(state.page==='alarms'){ title='Alarms'; sub='Review active events and power-system alerts.'; }
  else if(state.page==='map'){ title='Map View'; sub='Facility locations and live power status.'; bc=crumb(scopeCrumbItems()); }
  else if(state.page==='oncall'){ title='Alert Management'; sub='On-call rotation and pending acknowledgements.'; bc=crumb(scopeCrumbItems()); }
  else if(state.page==='analytics'){ title='Analytics'; sub='Live telemetry across monitored equipment.'; bc=crumb(scopeCrumbItems()); }
  else if(state.page==='users'){ title=state.scope?'Users':'Platform Users'; sub='Manage accounts and role-based access.'; bc=crumb(scopeCrumbItems()); }
  else if(state.page==='reports'){ title='Reports'; sub='Generator run, ATS emergency and test event reports.'; bc=crumb(scopeCrumbItems()); }
  else if(state.page==='settings'){ title='Platform Settings'; sub='Integration and platform configuration.'; }
  else if(state.page==='placeholder'){ title=state.placeholderTitle; sub='This section is part of the full CPC platform.'; }

  var role=roleDef();
  var initials=role.label.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
  var userMenu='<div class="user-menu-wrap">' +
    '<div class="user-chip" onclick="toggleUserMenu()"><div class="av">'+initials+'</div><div><b>'+role.label+'</b><small>Demo persona</small></div></div>';
  if(state.userMenuOpen){
    userMenu+='<div class="user-menu">' +
      '<div class="user-menu-role">Signed in as<b>'+role.label+'</b></div>' +
      '<button class="user-menu-item" onclick="logout()">&#8630; Log out</button>' +
    '</div>';
  }
  userMenu+='</div>';

  return '' +
  '<div class="topbar"><div>' + bc +
    '<div class="page-title">'+title+'</div><div class="page-sub">'+sub+'</div>' +
  '</div>' +
  '<div class="topbar-right">' +
    '<span class="demo-pill">&#9679; Demo mode</span>' +
    '<div class="icon-btn" title="Toggle dark mode" onclick="toggleDark()">&#9789;</div>' +
    '<div class="icon-btn" title="Notifications">&#128276;</div>' +
    userMenu +
  '</div></div>';
}

function pageContent(){
  switch(state.page){
    case 'dashboard': return dashboardPage();
    case 'resellers': return resellersPage();
    case 'companies-all': return companiesAllPage();
    case 'reseller': return resellerPage(state.scope.resellerId);
    case 'company': return companyPage(state.scope.companyId);
    case 'site': return sitePage(state.scope.siteId);
    case 'system': return systemPage(state.systemId);
    case 'alarms': return alarmsPage();
    case 'map': return mapViewPage();
    case 'oncall': return onCallPage();
    case 'analytics': return analyticsPage();
    case 'users': return usersPage();
    case 'reports': return reportsPage();
    case 'settings': return settingsPage();
    case 'placeholder': return placeholderPage();
    default: return dashboardPage();
  }
}

  html+=kpi('Active Alarms', activeAlarms.length, activeAlarms.length? 'Needs attention' : 'All clear', activeAlarms.length?'r':'g');

function kpi(label,value,note,tone){
  var color = tone==='r' ? 'var(--red)' : tone==='g' ? 'var(--green)' : 'var(--text)';
  return '<div class="card kpi"><span>'+label+'</span><b style="color:'+color+'">'+value+'</b><small>'+note+'</small></div>';
}

function systemStats(sy){
  var generatorsReady = sy.generators.filter(function(g){return g.status!=='FAULT';}).length;
  var atsNormal = sy.ats.filter(function(a){return a.status!=='EMERGENCY' && a.status!=='FAULT';}).length;
  var utilityAvailable = sy.ats.length ? sy.ats.some(function(a){return a.utilAvail;}) : sy.status!=='offline';
  var onEmergency = sy.ats.some(function(a){return a.connected==='GENERATOR';});
  var effectiveStatus = onEmergency ? 'emergency' : sy.status;
  return { generatorsReady:generatorsReady, atsNormal:atsNormal, utilityAvailable:utilityAvailable, effectiveStatus:effectiveStatus };
}
function systemCardHtml(sy){
  var st=systemStats(sy);

  var label = st.effectiveStatus==='emergency' ? 'EMERGENCY' : st.effectiveStatus==='offline' ? 'OFFLINE' : 'NORMAL';
  return '<div class="card site-system-card status-'+st.effectiveStatus+'">' +
    '<div class="site-system-card-head"><h3>'+sy.name+'</h3><span class="pill '+tone+(tone==='r'?' blink':'')+'">'+label+'</span></div>' +
    '<div class="site-system-card-sub">'+sy.ats.length+' ATS &middot; '+sy.generators.length+' Generators</div>' +
    '<div class="site-system-stats">' +
      '<div class="site-system-stat"><span>Utility</span><b class="'+(st.utilityAvailable?'stat-good':'stat-bad')+'">'+(st.utilityAvailable?'Available':'Unavailable')+'</b></div>' +
      '<div class="site-system-stat"><span>Generators</span><b>'+st.generatorsReady+' / '+sy.generators.length+' Ready</b></div>' +
      '<div class="site-system-stat"><span>ATS</span><b>'+st.atsNormal+' / '+sy.ats.length+' Normal</b></div>' +

}

/* ---------------------------- map view ---------------------------- */
function mapViewPage(){
  var scope=state.scope, pins=[], facilities, systems;
  if(scope && scope.level==='company'){
    var sites=scopedSitesOfCompany(scope.companyId);
    facilities=sites.length; systems=scopedSystemsOfCompany(scope.companyId);
    pins=sites.map(function(s){
      var sy=scopedSystemsOfSite(s.id);
      var em=sy.some(function(x){return x.status!=='normal';});
      return {x:s.x,y:s.y,label:s.name,status:em?'emergency':'normal',fn:"goSite('"+s.id+"')"};
    });
  } else if(scope && scope.level==='reseller'){
    var comps=companiesOfReseller(scope.resellerId);
    facilities=comps.length; systems=systemsOfReseller(scope.resellerId);
    pins=comps.map(function(c){
      var sy=systemsOfCompany(c.id);
      var em=sy.some(function(x){return x.status!=='normal';});
      return {x:c.x,y:c.y,label:c.name,status:em?'emergency':'normal',fn:"goCompany('"+c.id+"')"};
    });
  } else {
    facilities=DB.companies.length; systems=DB.systems;
    pins=DB.companies.map(function(c){
      var sy=systemsOfCompany(c.id);
      var em=sy.some(function(x){return x.status!=='normal';});
      return {x:c.x,y:c.y,label:c.name,status:em?'emergency':'normal',fn:"goCompany('"+c.id+"')"};
    });
  }
  var normal=systems.filter(function(s){return s.status==='normal';}).length;
  var html='<div class="card" style="padding:0;overflow:hidden"><div class="map-wrap"><div class="map-grid-lines"></div>';
  pins.forEach(function(p){
    html+='<div class="map-pin '+(p.status==='normal'?'g':'r')+'" style="left:'+p.x+'%;top:'+p.y+'%" onclick="'+p.fn+'"><i></i><b>'+p.label+'</b></div>';
  });
  html+='<div class="map-legend"><div style="font-size:10px;font-weight:800;margin-bottom:6px">STATUS</div>' +
    '<div class="map-legend-item"><span class="map-legend-dot" style="background:#22c55e"></span>Normal</div>' +
    '<div class="map-legend-item"><span class="map-legend-dot" style="background:#ef4444"></span>Emergency</div></div>';
  html+='</div></div>';
  html+='<div class="kpi-grid" style="margin-top:16px">';
  html+=kpi('Facilities', facilities, 'Plotted on map');
  html+=kpi('Systems', systems.length, 'Monitored');
  html+=kpi('Normal', normal, 'Operating on utility', 'g');
  html+=kpi('Events', systems.length-normal, (systems.length-normal)?'Needs attention':'All clear', (systems.length-normal)?'r':'g');
  html+='</div>';
  return html;
}

/* ---------------------------- analytics ---------------------------- */
function analyticsPage(){
  var companyId=state.scope && state.scope.companyId;
  var systems= companyId ? scopedSystemsOfCompany(companyId) : DB.systems;
  var equipment=[];
  systems.forEach(function(sy){
    sy.generators.forEach(function(g){
      var running=g.status==='RUNNING';
      equipment.push({kind:'generator', name:g.name, status:g.status, kw:g.kw, load:g.pct, fuel:g.fuel, hours:g.hours, online:running, vab:g.vab, hz:g.hz, pf:g.pf});
    });
    sy.ats.forEach(function(a){
      var load=Math.min(100, Math.round(a.kw/300*100));
      equipment.push({kind:'ats', name:a.name, status:a.status, kw:a.kw, load:load, fuel:null, hours:null, online:a.connected!=='OFFLINE', vab:a.vab, hz:a.hz, pf:null});
    });
  });
  var alarmsCount=equipment.filter(function(e){return e.status==='FAULT'||e.status==='EMERGENCY';}).length;
  var totalKw=equipment.reduce(function(t,e){return t+(e.kw||0);},0);
  var avgLoad=equipment.length? Math.round(equipment.reduce(function(t,e){return t+(e.load||0);},0)/equipment.length) : 0;

  var html='<div class="card an-intro"><div><h2>Grafana analytics and live telemetry</h2><p>Live readings refresh automatically. Click a device row for its trend, or open the full Grafana workspace.</p></div>' +
    '<div class="an-actions"><button class="btn primary" onclick="openPlaceholder(\'Grafana Analytics\')">Open in Grafana &#8599;</button><span class="live-badge">&#9679; Live data</span></div></div>';

  html+='<div class="kpi-grid">';
  html+=kpi('Monitored assets', equipment.length, 'Generators + ATS');
  html+=kpi('Healthy assets', equipment.length-alarmsCount, '', 'g');
  html+=kpi('Active alarms', alarmsCount, alarmsCount?'Needs attention':'All clear', alarmsCount?'r':'g');
  html+=kpi('Active load', totalKw+' kW', 'Across fleet');
  html+=kpi('Avg utilisation', avgLoad+'%', 'Of connected capacity');
  html+='</div>';

  html+='<div class="tabs" style="margin:0 0 14px">';
  ['System overview','Generator performance','Power quality'].forEach(function(v){
    html+='<div class="tab'+(state.analyticsView===v?' active':'')+'" onclick="setAnalyticsView(\''+v+'\')">'+v+'</div>';
  });
  html+='</div>';

  var mode = state.analyticsView==='Generator performance' ? 'generator' : state.analyticsView==='Power quality' ? 'quality' : 'overview';
  var rows = mode==='generator' ? equipment.filter(function(e){return e.kind==='generator';}) : equipment;
  html+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Equipment</th><th>Status</th>';
  if(mode==='generator') html+='<th>Load</th><th>Fuel</th><th>Engine hours</th>';
  else if(mode==='quality') html+='<th>Voltage AB</th><th>Frequency</th><th>Power factor</th><th>Load</th>';
  else html+='<th>Power</th><th>Load</th><th>Connection</th>';
  html+='</tr></thead><tbody>';
  rows.forEach(function(e){
    var bad = e.status==='FAULT'||e.status==='EMERGENCY';
    html+='<tr><td><b>'+e.name+'</b></td><td class="'+(bad?'state-bad':'state-ok')+'">'+e.status+'</td>';
    if(mode==='generator') html+='<td>'+(e.load||0)+'%</td><td>'+(e.fuel!=null?e.fuel+'%':'—')+'</td><td>'+(e.hours!=null?e.hours.toFixed(1):'—')+' h</td>';
    else if(mode==='quality') html+='<td>'+e.vab+' V</td><td>'+e.hz+' Hz</td><td>'+(e.pf!=null?e.pf:'—')+'</td><td>'+(e.load||0)+'%</td>';
    else html+='<td>'+e.kw+' kW</td><td>'+(e.load||0)+'%</td><td>'+(e.online?'Connected':'Offline')+'</td>';
    html+='</tr>';
  });
  if(!rows.length) html+='<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">No equipment telemetry available.</td></tr>';
  html+='</tbody></table></div>';
  return html;
}

function reportsCalendarHtml(reports, companyId){
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var y=state.calYear, m=state.calMonth;
  var first=new Date(y,m,1), last=new Date(y,m+1,0);
  var dow=first.getDay(); dow = dow===0?6:dow-1;
  var days=[];
  for(var p=dow-1;p>=0;p--) days.push({date:new Date(y,m,-p), outside:true});
  for(var d=1; d<=last.getDate(); d++) days.push({date:new Date(y,m,d), outside:false});
  while(days.length%7!==0) days.push({date:new Date(y,m+1,days.length-last.getDate()-dow+1), outside:true});
  function fmt(dt){ return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); }
  var byDate={};
  reports.forEach(function(r){ (byDate[r.date]=byDate[r.date]||[]).push(r); });

  var html='<div class="cal-nav"><button onclick="calPrev()">&lsaquo;</button><b>'+MONTHS[m]+' '+y+'</b><button onclick="calNext()">&rsaquo;</button></div>';
  html+='<div class="cal-grid">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(dn){ html+='<div class="cal-dow">'+dn+'</div>'; });
  days.forEach(function(dObj){
    var key=fmt(dObj.date); var evs=byDate[key]||[];
    html+='<div class="cal-cell'+(dObj.outside?' outside':'')+(key===TODAY_ISO?' today':'')+'"><div class="cal-day-num">'+dObj.date.getDate()+'</div>';
    evs.forEach(function(r){
      html+='<div class="cal-event" onclick="openReport(\''+r.id+'\')">'+r.type+'<small>'+(byId(DB.systems,r.systemId)||{}).name+'</small></div>';
    });
    html+='</div>';
  });
  html+='</div>';
  return html;
}
function reportsListHtml(reports, companyId){

function complianceTabHtml(reports, companyId){
  var systems=scopedSystemsOfCompany(companyId);
  var rows=[];
  systems.forEach(function(sy){
    sy.ats.forEach(function(a){
      var count=reports.filter(function(r){return r.systemId===sy.id && r.initiatingAts===a.name;}).length;
      rows.push({sys:sy.name, ats:a.name, branch:a.branch, count:count, ok:count>0});
    });

  var total=rows.length, ok=rows.filter(function(r){return r.ok;}).length;
  var pct= total? Math.round(ok/total*100) : 0;
  var html='<div class="section-head"><div><span>Compliance</span><h2>Annual ATS Initiating Compliance</h2></div></div>';
  html+='<p style="font-size:11.5px;color:var(--text-dim);margin:-6px 0 14px">Every ATS should be the initiating ATS for at least one test per year.</p>';
  html+='<div class="kpi-grid">';
  html+=kpi('Compliant', pct+'%', '', 'g');
  html+=kpi('ATS compliant', ok, '', 'g');
  html+=kpi('Outstanding', total-ok, '', (total-ok)?'r':'g');
  html+=kpi('Total ATS', total, '');
  html+='</div>';
  html+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>System</th><th>ATS</th><th>Branch</th><th>Initiations</th><th>Status</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr><td><b>'+r.sys+'</b></td><td>'+r.ats+'</td><td>'+r.branch+'</td><td>'+r.count+'</td>' +
      '<td><span class="pill '+(r.ok?'g':'r')+'">'+(r.ok?'Compliant':'Outstanding')+'</span></td></tr>';

    html+='<footer class="tw-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" '+(canContinue?'':'disabled')+' onclick="wizardGoStep(\'confirm\')">Continue</button></footer>';
  }

  else if(w.step==='confirm'){
    html+='<div class="tw-warn"><b>Review before starting</b><span>This will begin the configured '+(w.testType==='load'?'ATS transfer':'generator no-load')+' test sequence.</span></div>';
    html+='<dl class="tw-summary">' +
      '<div><dt>Test type</dt><dd>'+(w.testType==='load'?'Load test':'No-load test')+'</dd></div>' +
      '<div><dt>Duration</dt><dd>'+w.duration+' minutes</dd></div>' +
      '<div><dt>Start delay</dt><dd>'+w.startDelay+' minutes</dd></div>';
    if(w.testType==='load'){
      html+='<div><dt>Initiating ATS</dt><dd>'+(initiating?initiating.name:'Not selected')+'</dd></div>' +
        '<div><dt>Block sequence</dt><dd>'+w.blockSize+' ATS every '+w.blockDelay+' seconds</dd></div>' +
        '<div style="grid-column:1/-1"><dt>Included ATS</dt><dd>'+selectedAts.map(function(a){return a.name;}).join(', ')+'</dd></div>';
    } else {
      html+='<div style="grid-column:1/-1"><dt>Selected generators</dt><dd>'+selectedGen.map(function(g){return g.name;}).join(', ')+'</dd></div>';
    }
    html+='</dl>';
    html+='<footer class="tw-actions"><button class="btn" onclick="wizardGoStep(\'setup\')">Back to setup</button><button class="btn primary" onclick="wizardBegin()">Start test</button></footer>';
  }

  else if(w.step==='monitor'){
    html+='<div class="tw-run-summary">' +
      '<div><span>Test ID</span><b>TEST-'+new Date().getFullYear()+'-001</b></div>' +
      '<div><span>Mode</span><b>'+(w.testType==='load'?'Load test':'No-load test')+'</b></div>' +
      '<div><span>Duration</span><b>'+pad2(Math.floor(w.duration*60/60))+':'+pad2(w.duration*60%60)+'</b></div>' +
      '<div><span>Remaining</span><b>'+pad2(Math.floor(remaining/60))+':'+pad2(remaining%60)+'</b></div>' +
      '<button class="btn small" onclick="wizardAdvance()">Advance 1 min</button>' +
    '</div>';
    html+='<div class="tw-live"><section><div class="tw-panel-title"><h3>'+(w.testType==='load'?'ATS status':'Generator status')+'</h3><span class="live-badge">Running</span></div>';
    if(w.testType==='load'){
      html+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>ATS</th><th>Test signal</th><th>Position</th><th>Result</th></tr></thead><tbody>';
      selectedAts.forEach(function(a){
        html+='<tr><td>'+a.name+'</td><td><span class="pill g">Active</span></td><td><span class="pill r">Emergency</span></td><td><span class="pill g">Passed</span></td></tr>';
      });
      html+='</tbody></table></div>';
    } else {
      selectedGen.forEach(function(g){
        html+='<div class="fp-box" style="margin-bottom:8px"><b>'+g.name+'</b><span>Engine running</span></div>';
      });
    }
    html+='</section><section><div class="tw-panel-title"><h3>Event log</h3><span style="color:var(--text-dim);font-size:10px">Live</span></div>';
    html+='<ol class="evt-log" style="list-style:none;padding-left:0">' +
      '<li><time>00:00</time>Test started</li>' +
      '<li><time>00:05</time>Generator start command issued</li>';
    if(w.testType==='load'){
      html+='<li><time>00:15</time>'+(initiating?initiating.name:'Initiating ATS')+' test signal active</li>' +
        '<li><time>00:42</time>ATS group transferred to emergency</li>';
    }
    html+='<li><time>01:00</time>Test window recording</li></ol></section></div>';
    html+='<footer class="tw-actions"><button class="btn danger" onclick="wizardFinish()">Abort test</button><button class="btn primary" onclick="wizardFinish()">Complete test</button></footer>';
  }

  else if(w.step==='result'){
    html+='<div class="tw-result-banner"><i>OK</i><div><h3>Test sequence completed</h3><p>Test data has been recorded and the equipment has returned to its normal position.</p></div></div>';
    html+='<div class="tw-result-grid">' +
      '<div><span>Test type</span><b>'+(w.testType==='load'?'Load test':'No-load test')+'</b></div>' +
      '<div><span>Duration</span><b>'+w.duration+' minutes</b></div>' +
      '<div><span>ATS passed</span><b>'+(w.testType==='load'?selectedAts.length+' / '+selectedAts.length:'Not applicable')+'</b></div>' +
      '<div><span>Generator status</span><b>'+(sys.generators.length?'Running signals received':'Not available')+'</b></div>' +
    '</div>';
    html+='<footer class="tw-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary">Generate report</button></footer>';
  }

  html+='</div>';
  return html;
}

function reportDetailHtml(id){
  var r=byId(DB.reports, id);
  var sys=byId(DB.systems, r.systemId);
  var lp=r.loadProfile||[];
  var threshold=(r.ratedKw||0)*0.3;
  var perPoint = r.durationMin && lp.length>1 ? r.durationMin/(lp.length-1) : 0;
  var maxRun=0, curRun=0;
  lp.forEach(function(kw){ if(kw>=threshold){ curRun+=perPoint; if(curRun>maxRun) maxRun=curRun; } else curRun=0; });
  var pass=maxRun>=30;
  var peakVal=Math.max.apply(null, lp.concat([1]));

  var html='<button class="modal-close" onclick="closeModal()">&times;</button><div class="fp">';
  html+='<div class="fp-head"><div><h3>'+r.code+'</h3><p>'+sys.name+' &middot; '+r.date+' '+r.time+' &middot; '+r.durationLabel+'</p></div>' +
    '<span class="pill '+(r.type==='gen-run'?'a':r.type==='ats-emergency'?'r':'g')+'">'+REPORT_TYPE_LABEL[r.type]+'</span></div>';

  html+='<div class="fp-grid2" style="grid-template-columns:repeat(5,1fr)">' +
    '<div class="fp-box"><span>Initiating ATS</span><b>'+(r.initiatingAts||'—')+'</b></div>' +
    '<div class="fp-box"><span>Rated capacity</span><b>'+r.ratedKw+' kW</b></div>' +
    '<div class="fp-box"><span>Peak load</span><b style="color:var(--accent)">'+r.peakKw+' kW ('+(r.ratedKw?Math.round(r.peakKw/r.ratedKw*100):0)+'%)</b></div>' +
    '<div class="fp-box"><span>Avg load</span><b>'+r.avgKw+' kW ('+(r.ratedKw?Math.round(r.avgKw/r.ratedKw*100):0)+'%)</b></div>' +
    '<div class="fp-box'+(pass?' on':'')+'"><span>&ge;30% for 30m</span><b style="color:'+(pass?'var(--green)':'var(--red)')+'">'+(pass?'Pass':'Fail')+' <small style="font-weight:600;color:var(--text-dim)">('+Math.round(maxRun)+'m)</small></b></div>' +
  '</div>';

  html+='<div class="fp-section-title">Generator Load Profile</div>';
  html+='<div class="chart-bars">';
  lp.forEach(function(kw){
    var h=Math.max(2, Math.round(kw/peakVal*100));
    html+='<i class="'+(kw>=threshold?'hi':'')+'" style="height:'+h+'%" title="'+kw+' kW"></i>';
  });
  html+='</div>';
  html+='</div>';
  return html;
}
