<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPM — Emergency Power Management (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ─── EMPM Design System ───
   Single source of truth for all visual styles.
   Components use class names from here — no inline styles for structural layout.
*/

:root {
  --bg: #0a0e1a; --surface: #111827; --surface-2: #1a2236; --surface-3: #1f2b3f;
  --border: #1e293b; --border-2: #2a3a50;
  --text: #e2e8f0; --text-dim: #64748b; --text-muted: #475569;
  --green: #22c55e; --red: #ef4444; --amber: #f59e0b;
  --blue: #3b82f6; --cyan: #06b6d4; --purple: #a855f7;
  --sidebar-w: 220px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
#root { display:flex; height:100vh; }
a { text-decoration:none; color:inherit; }

/* ─── SIDEBAR ─── */
.sidebar { width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; z-index:20; }
.sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.sidebar-logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#3b82f6,#06b6d4); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:10px; color:white; }
.sidebar-brand { font-size:15px; font-weight:700; letter-spacing:-0.02em; }
.sidebar-brand span { color:var(--cyan); }
.sidebar-nav { flex:1; padding:10px 8px; overflow-y:auto; }
.nav-section { margin-bottom:14px; }
.nav-section-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-muted); padding:0 8px; margin-bottom:4px; }
.nav-item { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:7px; font-size:12.5px; font-weight:500; color:var(--text-dim); cursor:pointer; transition:all 0.15s; border:1px solid transparent; }
.nav-item:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.nav-item.active { color:var(--text); background:rgba(59,130,246,0.1); border-color:rgba(59,130,246,0.15); }
.nav-item svg { flex-shrink:0; opacity:0.6; }
.nav-item.active svg { opacity:1; color:var(--blue); }
.nav-badge { margin-left:auto; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; background:rgba(239,68,68,0.15); color:var(--red); }
.sidebar-footer { padding:12px 16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#a855f7); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:white; }
.user-name { font-size:12px; font-weight:600; }
.user-role { font-size:10px; color:var(--text-dim); }

/* ─── MAIN LAYOUT ─── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.header { padding:10px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--surface); flex-shrink:0; }
.header-left { display:flex; align-items:center; gap:12px; }
.page-title { font-size:17px; font-weight:700; }
.breadcrumb-trail { font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:5px; }
.breadcrumb-trail .bc-sep { opacity:0.4; }
.breadcrumb-trail .bc-link { color:var(--blue); cursor:pointer; }
.breadcrumb-trail .bc-link:hover { text-decoration:underline; }
.header-right { display:flex; align-items:center; gap:12px; }
.header-btn { padding:5px 12px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; display:flex; align-items:center; gap:5px; transition:all 0.15s; }
.header-btn:hover { background:#1e293b; }
.header-btn.primary { background:var(--blue); border-color:var(--blue); color:white; }
.search-box { display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); font-size:12px; color:var(--text-dim); min-width:180px; }
.search-box input { background:none; border:none; color:var(--text); font-size:12px; font-family:inherit; outline:none; flex:1; }
.content { flex:1; overflow-y:auto; padding:20px 24px; }

/* ─── STAT CARDS ─── */
.dash-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
.dash-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
.dash-card .dc-label { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:3px; }
.dash-card .dc-val { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
.dash-card .dc-sub { font-size:10px; color:var(--text-dim); margin-top:2px; }

/* ─── DATA TABLE ─── */
.data-table { width:100%; border-collapse:collapse; }
.data-table th { text-align:left; font-size:10px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; padding:7px 10px; border-bottom:1px solid var(--border); }
.data-table td { padding:8px 10px; border-bottom:1px solid var(--border); font-size:12.5px; }
.data-table tr:hover td { background:rgba(255,255,255,0.02); }
.mono { font-family:'JetBrains Mono',monospace; font-size:11px; }

/* ─── STATUS PILL ─── */
.status-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:12px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
.pill-normal { background:rgba(34,197,94,0.12); color:var(--green); }
.pill-emergency { background:rgba(239,68,68,0.12); color:var(--red); }
.pill-alarm { background:rgba(245,158,11,0.12); color:var(--amber); }
.pill-test { background:rgba(168,85,247,0.12); color:var(--purple); }
.pill-offline { background:rgba(100,116,139,0.12); color:var(--text-dim); }
.pill-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

/* ─── SECTION HEADER ─── */
.section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.section-title { font-size:13px; font-weight:700; }
.section-sub { font-size:11px; color:var(--text-dim); }

/* ─── INFO CARDS ─── */
.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; margin-bottom:18px; }
.info-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; transition:all 0.2s; }
.info-card:hover { border-color:rgba(255,255,255,0.12); transform:translateY(-1px); }
.info-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.info-card-title { font-size:13px; font-weight:700; }
.info-card-body { display:flex; gap:14px; flex-wrap:wrap; }
.info-card-stat { text-align:center; min-width:48px; }
.info-card-stat .v { font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; }
.info-card-stat .l { font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
.reseller-label { font-size:10px; color:var(--text-muted); margin-bottom:6px; }

/* ─── SYSTEM VIEW ─── */
.system-topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.sys-left { display:flex; align-items:center; gap:14px; }
.sys-conn { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--green); font-weight:500; }
.sys-conn .dot { width:5px; height:5px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); }
.sys-clock { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); }
.view-toggle,.scenario-nav { display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:2px; }
.vt-btn,.sc-btn { padding:4px 12px; border-radius:5px; font-size:11px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--text-dim); transition:all 0.2s; font-family:inherit; }
.vt-btn:hover,.sc-btn:hover { color:var(--text); }
.vt-btn.active { background:rgba(59,130,246,0.15); color:var(--blue); }
.sc-btn.active-n { background:rgba(34,197,94,0.15); color:var(--green); }
.sc-btn.active-e { background:rgba(239,68,68,0.15); color:var(--red); }
.sc-btn.active-t { background:rgba(168,85,247,0.15); color:var(--purple); }
.sys-diagram { display:flex; flex-direction:column; align-items:center; gap:0; width:100%; }
.sys-sources { display:flex; justify-content:space-between; width:100%; max-width:1000px; }
.sys-src-card { width:200px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; transition:all 0.5s; }
.sys-src-card h4 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:2px; transition:color 0.5s; }
.sys-src-card .sub { font-size:9px; color:var(--text-dim); margin-bottom:8px; }
.sys-src-readings { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.ssr { background:rgba(0,0,0,0.3); border-radius:5px; padding:4px; text-align:center; }
.ssr .l { font-size:7px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
.ssr .v { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; transition:color 0.5s; }
.ssr .u { font-size:8px; color:var(--text-dim); }
.sys-src-status { margin-top:6px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; display:flex; align-items:center; justify-content:center; gap:5px; transition:color 0.5s; }
.gen-load-bar { margin-top:6px; }
.glb-label { display:flex; justify-content:space-between; font-size:8px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:2px; }
.glb-track { width:100%; height:5px; background:rgba(0,0,0,0.4); border-radius:3px; overflow:hidden; }
.glb-fill { height:100%; border-radius:3px; transition:width 1s,background 0.5s; }
.fuel-box { margin-top:6px; padding:5px; background:rgba(0,0,0,0.3); border-radius:6px; text-align:center; }
.fuel-box .fl { font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
.fuel-box .fv { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; }
.fuel-box .fs { font-size:8px; color:var(--text-dim); }
.fuel-bar-track { width:100%; height:4px; background:rgba(0,0,0,0.4); border-radius:2px; overflow:hidden; margin-top:2px; }
.fuel-bar-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e); transition:width 1s; }
.oneline-svg { width:100%; max-width:1000px; }

/* ─── ATS EQUIPMENT CARDS ─── */
.ats-cards-row { display:flex; justify-content:center; gap:14px; width:100%; max-width:1000px; }
.ats-equip { flex:1; max-width:310px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:all 0.4s ease; }
.ats-equip-header { padding:8px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
.ats-equip-header .left { display:flex; align-items:center; gap:7px; }
.ats-equip-name { font-size:13px; font-weight:700; }
.ats-equip-mini-stats { display:flex; gap:8px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); transition:color 0.5s; }
.ats-equip-body { overflow:hidden; transition:max-height 0.4s ease, opacity 0.3s ease, padding 0.4s ease; }
.ats-equip-body.collapsed { max-height:0; opacity:0; padding:0 12px; }
.ats-equip-body.expanded { max-height:200px; opacity:1; padding:8px 12px; }
.ats-body-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.ats-rdg { background:rgba(0,0,0,0.25); border-radius:5px; padding:6px; text-align:center; }
.ats-rdg .l { font-size:7px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
.ats-rdg .v { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; transition:color 0.5s; }
.ats-equip-footer { padding:6px 12px; border-top:1px solid var(--border); display:flex; justify-content:space-between; font-size:9px; color:var(--text-dim); overflow:hidden; transition:max-height 0.4s ease, opacity 0.3s ease, padding 0.4s ease; }
.ats-equip-footer.collapsed { max-height:0; opacity:0; padding:0 12px; }
.ats-equip-footer.expanded { max-height:50px; opacity:1; padding:6px 12px; }
.branch-tag { font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; color:white; }
.branch-tag.ls { background:#ef4444; }
.branch-tag.cr { background:#f59e0b; color:#1a1a2e; }
.branch-tag.eq { background:#1e3a5f; }
.ats-pos-badge { font-size:9px; font-weight:600; padding:2px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:0.04em; }
.pos-normal { background:rgba(34,197,94,0.12); color:var(--green); }
.pos-emergency { background:rgba(239,68,68,0.12); color:var(--red); }
.pos-test { background:rgba(168,85,247,0.12); color:var(--purple); }

/* ─── LOAD LABELS ─── */
.load-labels-row { display:flex; justify-content:center; gap:14px; width:100%; max-width:1000px; margin-top:6px; }
.load-lbl { flex:1; max-width:310px; text-align:center; padding:6px; background:rgba(255,255,255,0.02); border:1px dashed var(--border); border-radius:6px; }
.load-lbl .n { font-size:10px; font-weight:600; }
.load-lbl .d { font-size:9px; color:var(--text-dim); }
.load-lbl .kw { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:var(--cyan); margin-top:2px; }

/* ─── EVENT BANNER ─── */
.sys-event-banner { width:100%; max-width:1000px; padding:0; border-radius:8px; display:flex; justify-content:center; align-items:center; gap:24px; margin-bottom:8px; transition:all 0.5s; max-height:0; overflow:hidden; opacity:0; }
.sys-event-banner.visible { max-height:50px; opacity:1; padding:6px 14px; }
.sys-event-banner.emer-bg { background:rgba(239,68,68,0.06); border:1px solid rgba(239,68,68,0.15); }
.sys-event-banner.test-bg { background:rgba(168,85,247,0.06); border:1px solid rgba(168,85,247,0.15); }
.sev-stat { display:flex; align-items:center; gap:5px; font-size:11px; }
.sev-stat .l { color:var(--text-dim); }
.sev-stat .v { font-family:'JetBrains Mono',monospace; font-weight:600; }
.sev-timer { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; }
.sev-timer .colon { animation:blink 1s step-end infinite; }

/* ─── BOTTOM STATUS ─── */
.sys-bottombar { width:100%; max-width:1000px; display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:1px solid var(--border); margin-top:8px; }
.sbb-stats { display:flex; gap:20px; }
.sbb-s { display:flex; align-items:center; gap:4px; font-size:11px; }
.sbb-s .l { color:var(--text-dim); }
.sbb-s .v { font-family:'JetBrains Mono',monospace; font-weight:600; }

/* ─── ALARMS ─── */
.alarm-group { margin-bottom:18px; }
.alarm-group-header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:8px 8px 0 0; }
.alarm-group-header .ag-name { font-size:12px; font-weight:700; flex:1; }
.alarm-sub-group { padding:0 0 0 16px; border-left:2px solid var(--border); margin-left:20px; }
.alarm-sub-header { display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:11px; font-weight:600; color:var(--text-dim); border-bottom:1px solid var(--border); }

/* ─── MAP ─── */
.map-container { position:relative; width:100%; background:var(--surface); border-radius:12px; border:1px solid var(--border); overflow:hidden; }
.map-svg { width:100%; height:100%; }
.map-pin { cursor:pointer; transition:all 0.2s; }
.map-pin:hover { filter:brightness(1.3); }
.map-legend { position:absolute; bottom:16px; left:16px; background:rgba(17,24,39,0.92); border:1px solid var(--border); border-radius:8px; padding:10px 14px; z-index:1000; }
.map-legend-item { display:flex; align-items:center; gap:6px; font-size:10px; margin-bottom:4px; }
.map-legend-dot { width:8px; height:8px; border-radius:50%; }
.map-stats { position:absolute; top:16px; right:60px; background:rgba(17,24,39,0.92); border:1px solid var(--border); border-radius:8px; padding:10px 14px; z-index:1000; }
.map-stat-row { display:flex; justify-content:space-between; gap:20px; font-size:11px; margin-bottom:3px; }

/* Leaflet overrides for dark theme */
.leaflet-container { background:#080c16; font-family:Inter,-apple-system,sans-serif; }
.leaflet-control-zoom a { background:rgba(17,24,39,0.92)!important; color:#e2e8f0!important; border-color:var(--border)!important; }
.leaflet-control-zoom a:hover { background:var(--surface-2)!important; }
.empm-map-tooltip { background:rgba(17,24,39,0.95)!important; border:1px solid var(--border)!important; border-radius:8px!important; padding:8px 12px!important; box-shadow:0 4px 20px rgba(0,0,0,0.5)!important; color:#e2e8f0!important; }
.empm-map-tooltip .leaflet-tooltip-tip { border-top-color:rgba(17,24,39,0.95)!important; }
.empm-map-label { background:none!important; border:none!important; box-shadow:none!important; }
.map-pulse-ring { animation:map-pulse 3s ease-in-out infinite; }
@keyframes map-pulse { 0%,100%{opacity:0.3;stroke-width:1} 50%{opacity:0.08;stroke-width:2} }

/* ─── ANIMATIONS ─── */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ─── SCOPE HEADER (context-switching sidebar) ─── */
.scope-header { display:flex; align-items:center; gap:8px; padding:8px 10px; margin:0 -8px 4px; border-radius:7px; cursor:pointer; font-size:11px; color:var(--blue); transition:all 0.15s; }
.scope-header:hover { background:rgba(59,130,246,0.08); }
.scope-back-label { font-weight:600; }
.scope-title { font-size:14px; font-weight:700; padding:0 2px; margin-bottom:1px; }
.scope-subtitle { font-size:10px; color:var(--text-dim); padding:0 2px; margin-bottom:8px; }
.scope-status-row { display:flex; gap:12px; padding:0 2px 10px; border-bottom:1px solid var(--border); margin-bottom:10px; }
.scope-stat { font-size:10px; color:var(--text-dim); display:flex; align-items:center; gap:4px; }
.scope-stat .v { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; }

/* ─── SYSTEM NAV ITEMS ─── */
.sys-nav-item { font-size:11.5px!important; }
.sys-nav-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sys-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.dot-green { background:var(--green); box-shadow:0 0 4px rgba(34,197,94,0.4); }
.dot-red { background:var(--red); box-shadow:0 0 4px rgba(239,68,68,0.4); animation:pulse-dot 2s ease-in-out infinite; }
.dot-amber { background:var(--amber); box-shadow:0 0 4px rgba(245,158,11,0.4); }
.dot-purple { background:var(--purple); box-shadow:0 0 4px rgba(168,85,247,0.4); }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ─── ALARM FILTER BAR ─── */
.alarm-filter-bar { display:flex; gap:4px; margin-bottom:16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; }
.alarm-filter-btn { padding:6px 14px; border-radius:6px; font-size:11px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--text-dim); font-family:inherit; transition:all 0.15s; }
.alarm-filter-btn:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.alarm-filter-btn.active { background:rgba(59,130,246,0.15); color:var(--blue); }

/* System scope filter bar */
.system-filter-bar { display:flex; gap:4px; margin-bottom:16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; flex-wrap:wrap; }
.system-filter-btn { display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--text-dim); font-family:inherit; transition:all 0.15s; white-space:nowrap; }
.system-filter-btn:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.system-filter-btn.active { background:rgba(6,182,212,0.15); color:var(--cyan); }
.system-filter-btn .sys-dot { width:6px; height:6px; flex-shrink:0; }

/* ─── ACKNOWLEDGEMENT ─── */
.ack-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
.ack-badge.acked { background:rgba(34,197,94,0.12); color:var(--green); }
.ack-badge.unacked { background:rgba(239,68,68,0.12); color:var(--red); }
.ack-detail { display:flex; flex-direction:column; gap:2px; }
.ack-meta { font-size:9px; color:var(--text-dim); }
.ack-btn { padding:4px 12px; border-radius:6px; font-size:10px; font-weight:600; border:1px solid var(--amber); background:rgba(245,158,11,0.1); color:var(--amber); cursor:pointer; font-family:inherit; transition:all 0.15s; }
.ack-btn:hover { background:rgba(245,158,11,0.2); }

/* ─── ON-CALL / ALERT MANAGEMENT ─── */
.oncall-banner { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:18px; }
.oncall-banner-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin-bottom:8px; }
.oncall-banner-primary { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-bottom:4px; }
.oncall-banner-secondary { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); }
.oncall-role { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.06); color:var(--text-dim); margin-left:4px; }
.oncall-banner-right { display:flex; gap:20px; }
.oncall-stat { display:flex; flex-direction:column; align-items:center; }
.oncall-stat-val { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
.oncall-stat-label { font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
.oncall-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.oncall-dot.green { background:var(--green); box-shadow:0 0 6px rgba(34,197,94,0.4); }
.oncall-dot.amber { background:var(--amber); box-shadow:0 0 6px rgba(245,158,11,0.4); }
.oncall-table tr.oncall-today td { background:rgba(59,130,246,0.06); border-left:2px solid var(--blue); }

/* ─── ESCALATION CHAIN ─── */
.escalation-chain { display:flex; flex-direction:column; gap:0; margin-bottom:18px; }
.escalation-step { display:flex; align-items:flex-start; gap:12px; position:relative; }
.escalation-level { width:32px; height:32px; border-radius:50%; background:var(--surface-2); border:2px solid var(--border-2); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--blue); flex-shrink:0; z-index:1; }
.escalation-connector { position:absolute; left:15px; top:32px; bottom:0; width:2px; }
.escalation-line { width:2px; height:100%; min-height:28px; background:var(--border); }
.escalation-info { padding:6px 0 20px; }
.escalation-name { font-size:13px; font-weight:600; margin-bottom:2px; }
.escalation-meta { display:flex; gap:12px; }
.escalation-timeout { font-size:10px; color:var(--amber); font-weight:600; }
.escalation-method { font-size:10px; color:var(--text-dim); }

/* ─── REPORT TAB BAR ─── */
.report-tab-bar { display:flex; gap:4px; margin-bottom:18px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; }
.report-tab-btn { padding:7px 16px; border-radius:6px; font-size:11px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--text-dim); font-family:inherit; transition:all 0.15s; }
.report-tab-btn:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.report-tab-btn.active { background:rgba(59,130,246,0.15); color:var(--blue); }

/* ─── REPORT CALENDAR ─── */
.cal-nav { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; }
.cal-nav-btn { width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.cal-nav-btn:hover { background:var(--surface-2); }
.cal-nav-title { font-size:15px; font-weight:700; min-width:120px; text-align:center; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.cal-dow { background:#1a2338; padding:8px; text-align:center; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#cbd5f5; }
.cal-cell { background:var(--surface-2); min-height:80px; padding:6px; cursor:default; transition:background 0.15s; position:relative; }
.cal-cell.outside { background:#0f1629; }
.cal-cell.outside .cal-day-num { color:var(--text-muted); }
.cal-cell.today { background:rgba(59,130,246,0.06); }
.cal-cell.today .cal-day-num { color:var(--blue); font-weight:700; }
.cal-cell.has-events:hover { background:rgba(255,255,255,0.03); }
.cal-day-num { font-size:11px; font-weight:600; color:var(--text-dim); display:block; margin-bottom:4px; }
.cal-event { padding:3px 5px; border-radius:4px; background:rgba(255,255,255,0.04); margin-bottom:3px; cursor:pointer; transition:background 0.15s; }
.cal-event:hover { background:rgba(255,255,255,0.08); }
.cal-event-type { font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; display:block; }
.cal-event-sys { font-size:9px; color:var(--text-dim); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ─── REPORT DETAIL ─── */
.report-back-btn { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--blue); cursor:pointer; font-family:inherit; margin-bottom:14px; transition:all 0.15s; }
.report-back-btn:hover { background:var(--surface-2); }
.report-detail-header { margin-bottom:14px; }
.report-detail-id { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; margin-bottom:4px; }
.report-detail-meta { display:flex; align-items:center; gap:12px; font-size:12px; color:var(--text-dim); }
.report-stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px; }
.report-stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; }
.report-stat-label { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:3px; }
.report-stat-val { font-size:14px; font-weight:700; }
.report-chart-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:18px; }
.report-chart-title { font-size:12px; font-weight:700; margin-bottom:10px; }
.report-chart-canvas { width:100%; height:260px; display:block; }

/* ─── ATS COMPLIANCE ─── */
.compliance-summary { display:flex; align-items:center; gap:30px; padding:16px 20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:18px; }
.compliance-ring-wrap { width:100px; height:100px; flex-shrink:0; }
.compliance-ring { width:100%; height:100%; }
.compliance-stats { display:flex; gap:24px; }
.compliance-stat { display:flex; flex-direction:column; align-items:center; }
.compliance-stat .v { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
.compliance-stat .l { font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* Demo-only: page visibility */
.page { display:none; }
.page.active { display:block; }
</style>

// ─── DATA HELPERS (from data/index.js) ───
function companiesForReseller(rk) {
  const r = DATA.resellers[rk]; if (!r) return [];
  return r.companies.map(k => DATA.companies[k]).filter(Boolean);
}
function systemsForCompany(ck) {
  const c = DATA.companies[ck]; if (!c) return [];
  return c.systems.map(k => DATA.systems[k]).filter(Boolean);
}
function reportsForSystem(sk) { return DATA.reports.filter(r => r.system === sk); }
function reportsForCompany(ck) {
  const c = DATA.companies[ck]; if (!c) return [];
  const s = new Set(c.systems); return DATA.reports.filter(r => s.has(r.system));
}
function alarmsForCompany(ck) {
  const c = DATA.companies[ck]; if (!c) return [];
  const s = new Set(c.systems); return DATA.alarms.filter(a => s.has(a.system));
}
function companyStats(ck) {
  const sl = systemsForCompany(ck);
  return { systems:sl.length, normal:sl.filter(s=>s.status==='normal').length, events:sl.filter(s=>s.status!=='normal').length, generators:sl.reduce((a,s)=>a+s.genCount,0) };
}
function resellerStats(rk) {
  const cl = companiesForReseller(rk);
  let ts=0,tn=0,te=0,tg=0;
  cl.forEach(c=>{const s=companyStats(c.id);ts+=s.systems;tn+=s.normal;te+=s.events;tg+=s.generators;});
  return {companies:cl.length,systems:ts,normal:tn,events:te,generators:tg};
}
function fleetStats() {
  const ts=Object.keys(DATA.systems).length;
  const tn=Object.values(DATA.systems).filter(s=>s.status==='normal').length;
  return {resellers:Object.keys(DATA.resellers).length,companies:Object.keys(DATA.companies).length,systems:ts,normal:tn,events:ts-tn,activeAlarms:DATA.alarms.filter(a=>a.status==='active').length};
}
function alarmsForReseller(rk) {
  const cl=companiesForReseller(rk), sysSet=new Set();
  cl.forEach(c=>c.systems.forEach(s=>sysSet.add(s)));
  return DATA.alarms.filter(a=>sysSet.has(a.system));
}
function oncallForCompany(ck) { return DATA.oncall[ck]||null; }
function usersForCompany(ck) {
  const c=DATA.companies[ck]; if(!c)return [];
  return DATA.users.filter(u=>u.scope&&c.name.includes(u.scope.split(' ')[0]));
}
function alarmsForSystem(sk) { return DATA.alarms.filter(a=>a.system===sk); }

// ─── SYSTEM DETAIL HYDRATION ───
const GEN_MAKES=[{make:'Cummins',models:['DQKAB','QSX15-G9','C1100D5','DQFAD']},{make:'Caterpillar',models:['C15','C18','C32','3512B']},{make:'Kohler',models:['KD800','KD1000','KD1250','80REZG']},{make:'Generac',models:['SD600','MD500','SG300','QT070']}];
const BRANCHES=[{branch:'ls',branchLabel:'Life Safety',branchDesc:'Fire alarms, exit lighting'},{branch:'cr',branchLabel:'Critical',branchDesc:'OR suites, ICU'},{branch:'eq',branchLabel:'Equipment',branchDesc:'HVAC, elevators'}];
const UTILITY_BY_COMPANY={msk:'Con Edison',piedmont:'Duke Energy',duke:'Duke Energy',nyu:'Con Edison',jhu:'BG&E',unc:'Duke Energy',capefear:'Duke Energy Progress'};
function hashSeed(key){let h=0;for(let i=0;i<key.length;i++)h=((h<<5)-h+key.charCodeAt(i))|0;return Math.abs(h);}
function seeded(seed){let s=seed;return function(min,max){s=(s*16807+0)%2147483647;return min+(s%(max-min+1));};}
function getSystemDetail(sk){
  const sys=DATA.systems[sk]; if(!sys)return null;
  if(sys.generator&&sys.ats)return sys;
  const rand=seeded(hashSeed(sk)),atsCount=sys.atsCount||3;
  const mfg=GEN_MAKES[rand(0,GEN_MAKES.length-1)],model=mfg.models[rand(0,mfg.models.length-1)];
  const kwPerAts=rand(100,200),ratedKW=Math.round((atsCount*kwPerAts)/50)*50;
  sys.generator={id:'GEN-'+sk.split('-').pop().toUpperCase(),make:mfg.make,model:model,ratedKW:ratedKW,hours:rand(200,4000),fuelTankGal:ratedKW>=600?500:ratedKW>=300?250:150,fuelPct:rand(40,98),burnRatePerKWHr:+(0.04+(rand(0,40)/1000)).toFixed(3)};
  const ats=[];
  const eqDescs=['HVAC, elevators','Imaging, labs','Kitchen, laundry','Data center, comms'];
  for(let i=0;i<atsCount;i++){
    const b=BRANCHES[Math.min(i,BRANCHES.length-1)];
    const suffix=i>=2?(i-1):'';
    const branchLabel=i<2?b.branchLabel:b.branchLabel+' '+suffix;
    const branchDesc=i<2?b.branchDesc:eqDescs[rand(0,3)];
    const kw=rand(40,Math.round(ratedKW/atsCount*1.2));
    const volts=rand(0,1)?480:208;
    const amps=Math.round(kw*1000/(volts*1.732*0.97));
    ats.push({id:'ATS-'+b.branch.toUpperCase()+suffix,branch:b.branch,branchLabel:branchLabel,branchDesc:branchDesc,make:rand(0,2)===0?'ASCO':mfg.make,serial:'G'+rand(10,99)+'M'+rand(100000,999999),kw:kw,amps:amps,volts:volts,pf:+(0.94+rand(0,4)/100).toFixed(2),ttb:(rand(50,100)/10).toFixed(1)+'s'});
  }
  sys.ats=ats;
  sys.utility={name:UTILITY_BY_COMPANY[sys.company]||'Local Utility',nominalVoltage:480};
  return sys;
}
